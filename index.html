<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宛名敬称チェッカー</title>
  <style>
    :root {
      --background: #DCC8DD;
      --surface: #FFFFFF;
      --text: #3A2A3D;
      --muted: #6B5470;
      --accent: #8B5FA0;
      --danger: #C0392B;
      --border: #CBB0CE;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100% - 32px, 640px);
      margin: 0 auto;
      padding: 24px 0;
    }

    .card {
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.4;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    label, .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    select, button {
      width: 100%;
      min-height: 44px;
      border-radius: 6px;
      font: inherit;
      font-size: 16px;
    }

    select {
      padding: 8px 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    select:focus-visible, button:focus-visible {
      outline: 3px solid rgba(139, 95, 160, .35);
      outline-offset: 2px;
    }

    .message {
      min-height: 25px;
      margin: 8px 0 0;
      color: var(--danger);
      font-size: 14px;
    }

    .result {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .result[hidden] { display: none; }

    .result section + section { margin-top: 16px; }

    .honorific {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 24px;
      font-weight: 700;
    }

    .example {
      margin: 0 0 8px;
      padding: 12px;
      overflow-wrap: anywhere;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 8px 16px;
      color: #FFFFFF;
      cursor: pointer;
      background: var(--accent);
      border: 1px solid var(--accent);
      font-weight: 700;
    }

    button:hover { filter: brightness(.94); }
    button:active { filter: brightness(.88); }

    .note {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    @media (max-width: 375px) {
      main { width: min(100% - 24px, 640px); padding: 16px 0; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>宛名敬称チェッカー</h1>
      <p class="lead">宛先の種類を選ぶと、適切な敬称と宛名例を確認できます。</p>

      <label for="recipient-type">宛先の種類</label>
      <select id="recipient-type" name="recipient-type" aria-describedby="message">
        <option value="">選んでください</option>
        <option value="person">個人</option>
        <option value="company">会社</option>
        <option value="department">部署</option>
        <option value="reply-envelope">返信用封筒</option>
      </select>
      <p id="message" class="message" role="alert">宛先の種類を選んでください</p>

      <div id="result" class="result" hidden aria-live="polite">
        <section>
          <p class="label">正しい敬称</p>
          <p id="honorific" class="honorific"></p>
        </section>
        <section>
          <p class="label">宛名例</p>
          <p id="example" class="example"></p>
          <button id="copy-button" type="button">コピー</button>
        </section>
        <section>
          <p class="label">よくある間違い</p>
          <p id="note" class="note"></p>
        </section>
      </div>
    </div>
  </main>

  <script>
    const recipientData = {
      person: {
        honorific: "様",
        example: "山田 太郎 様",
        note: "個人宛てには「様」を使います。「御中」は会社や部署など、組織・団体宛ての敬称です。"
      },
      company: {
        honorific: "御中",
        example: "一般社団法人〇〇〇〇協会 御中",
        note: "会社宛てには「御中」を使います。「株式会社〇〇様」のように、会社名に「様」を付けるのは誤りです。担当者名がある場合は「株式会社〇〇 山田様」のように個人名へ「様」を付けます。"
      },
      department: {
        honorific: "御中",
        example: "株式会社〇〇 経理部 御中",
        note: "部署宛てには「御中」を使います。「経理部様」のように「様」を付けたり、「御中」と「様」を併用したりしないようにしましょう。"
      },
      "reply-envelope": {
        honorific: "会社・部署宛は御中／個人宛は様",
        example: "株式会社〇〇 御中",
        note: "返信用封筒では、印字済みの「行」を二重線で消し、会社・部署宛てなら「御中」、個人宛てなら「様」に書き直します。「行」を直し忘れないよう、投函前に確認しましょう。"
      }
    };

    const select = document.querySelector("#recipient-type");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");
    const honorific = document.querySelector("#honorific");
    const example = document.querySelector("#example");
    const note = document.querySelector("#note");
    const copyButton = document.querySelector("#copy-button");

    function updateResult() {
      const data = recipientData[select.value];
      if (!data) {
        message.textContent = "宛先の種類を選んでください";
        result.hidden = true;
        return;
      }

      message.textContent = "";
      honorific.textContent = data.honorific;
      example.textContent = data.example;
      note.textContent = data.note;
      result.hidden = false;
      copyButton.textContent = "コピー";
    }

    select.addEventListener("change", updateResult);

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(example.textContent);
        copyButton.textContent = "コピーしました";
        window.setTimeout(() => { copyButton.textContent = "コピー"; }, 1800);
      } catch {
        message.textContent = "コピーに失敗しました。もう一度お試しください";
      }
    });
  </script>
</body>
</html>
